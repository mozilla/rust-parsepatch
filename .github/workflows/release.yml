name: Release

on:
  push:
    tags: [ "v*" ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # Required for crates.io trusted publishing (OIDC).

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Check that the tag matches the crate version
      run: |
        crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "parsepatch") | .version')
        tag_version="${GITHUB_REF_NAME#v}"
        if [ "$crate_version" != "$tag_version" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version"
          exit 1
        fi

    - name: Run tests
      run: cargo test --verbose

    - name: Authenticate with crates.io
      uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      id: auth

    - name: Publish
      run: cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
